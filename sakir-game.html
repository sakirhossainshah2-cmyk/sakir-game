<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakir Official Game</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        text-align: center;
        background: #111;
        color: white;
    }

    h1 {
        margin-top: 20px;
    }

    #game {
        width: 90%;
        max-width: 600px;
        height: 400px;
        margin: 20px auto;
        background: white;
        position: relative;
        overflow: hidden;
        border-radius: 15px;
    }

    #target {
        width: 55px;
        height: 55px;
        background: red;
        border-radius: 50%;
        position: absolute;
        display: none;
        cursor: pointer;
    }

    button {
        padding: 12px 25px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    #result {
        font-size: 22px;
        margin: 10px;
    }
</style>
</head>

<body>

<h1>🎮 Sakir Official Game</h1>

<p>লাল গোলটিতে যতবার সম্ভব Click করো!</p>

<div id="result">
    Score: 0 | Time: 30
</div>

<button onclick="startGame()">START GAME</button>

<div id="game">
    <div id="target" onclick="hitTarget()"></div>
</div>

<script>

let score = 0;
let time = 30;
let timer;
let playing = false;

const target = document.getElementById("target");
const game = document.getElementById("game");
const result = document.getElementById("result");

function startGame() {

    score = 0;
    time = 30;
    playing = true;

    target.style.display = "block";

    moveTarget();

    clearInterval(timer);

    timer = setInterval(function() {

        time--;

        result.innerHTML =
            "Score: " + score + " | Time: " + time;

        if (time <= 0) {
            endGame();
        }

    }, 1000);
}

function moveTarget() {

    if (!playing) return;

    let maxX = game.clientWidth - target.offsetWidth;
    let maxY = game.clientHeight - target.offsetHeight;

    let x = Math.random() * maxX;
    let y = Math.random() * maxY;

    target.style.left = x + "px";
    target.style.top = y + "px";
}

function hitTarget() {

    if (!playing) return;

    score++;

    result.innerHTML =
        "Score: " + score + " | Time: " + time;

    moveTarget();
}

function endGame() {

    playing = false;

    clearInterval(timer);

    target.style.display = "none";

    alert("Game Over! Your Score: " + score);

    result.innerHTML =
        "Final Score: " + score + " | Game Over";
}

</script>

</body>
</html>
